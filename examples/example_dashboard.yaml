# Complete Home Assistant dashboard example for Fuel Price Map.
#
# Requires via HACS: bubble-card, auto-entities, card-mod, layout-card,
# ha-map-card, and apexcharts-card.
#
# The Fuel Prices view is a full-width panel whose sole card is a responsive
# layout-card grid: list and map are side-by-side on desktop and stack below
# 700px.

views:
  - title: Fuel Prices
    type: panel
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: repeat(12, minmax(0, 1fr))
          grid-template-areas: |
            "header header header header header header header header header header header header"
            "separator separator separator separator separator separator separator separator separator separator separator separator"
            "list list list list list list map map map map map map"
            "popup popup popup popup popup popup popup popup popup popup popup popup"
          mediaquery:
            "(max-width: 700px)":
              grid-template-columns: 1fr
              grid-template-areas: |
                "header"
                "separator"
                "list"
                "map"
                "popup"
        cards:
          - type: custom:bubble-card
            view_layout:
              grid-area: header
            card_type: button
            button_type: name
            name: ⛽ Fuel Price Map
            icon: mdi:gas-station
            show_name: true
            show_icon: true
            button_action:
              tap_action:
                action: none
            sub_button:
              - icon: mdi:tune
                tap_action:
                  action: navigate
                  navigation_path: "#fuel-settings"
              - entity: sensor.fuel_price_map_active_location
                name: Toggle search location
                tap_action:
                  action: call-service
                  service: fuel_price_map.toggle_location

          - type: custom:bubble-card
            view_layout:
              grid-area: separator
            card_type: separator
            name: Cheapest nearby

          - type: custom:auto-entities
            view_layout:
              grid-area: list
            card:
              type: entities
              card_mod:
                style: |
                  ha-card {
                    max-height: min(65vh, 620px);
                    overflow-y: auto;
                  }
            filter:
              include:
                - domain: geo_location
                  attributes:
                    source: fuel_price_map
              exclude: []
            sort:
              method: attribute
              attribute: effective_price
              numeric: true

          - type: custom:map-card
            view_layout:
              grid-area: map
            theme_mode: dark
            zoom: 13
            focus_entity: sensor.fuel_price_map_active_location
            focus_follow: refocus
            card_mod:
              style: |
                ha-card {
                  width: 100%;
                  height: clamp(400px, 75vh, 800px);
                }
            # Active location is a focus target only, not a visible marker.
            entities:
              - entity: sensor.fuel_price_map_rank_1
                display: attribute
                attribute: map_label
                color: "#00c853"
              - entity: sensor.fuel_price_map_rank_2
                display: attribute
                attribute: map_label
                color: "#64b62c"
              - entity: sensor.fuel_price_map_rank_3
                display: attribute
                attribute: map_label
                color: "#9ccc0a"
              - entity: sensor.fuel_price_map_rank_4
                display: attribute
                attribute: map_label
                color: "#cddc39"
              - entity: sensor.fuel_price_map_rank_5
                display: attribute
                attribute: map_label
                color: "#ffeb3b"
              - entity: sensor.fuel_price_map_rank_6
                display: attribute
                attribute: map_label
                color: "#ffc107"
              - entity: sensor.fuel_price_map_rank_7
                display: attribute
                attribute: map_label
                color: "#ff9800"
              - entity: sensor.fuel_price_map_rank_8
                display: attribute
                attribute: map_label
                color: "#fb6d3a"
              - entity: sensor.fuel_price_map_rank_9
                display: attribute
                attribute: map_label
                color: "#f4511e"
              - entity: sensor.fuel_price_map_rank_10
                display: attribute
                attribute: map_label
                color: "#e53935"

          - type: custom:bubble-card
            view_layout:
              grid-area: popup
            card_type: pop-up
            hash: "#fuel-settings"
            name: Filters
            icon: mdi:tune
            cards:
              - type: custom:auto-entities
                card:
                  type: entities
                  title: Fuel Price Map filters
                filter:
                  include:
                    - integration: fuel_price_map
                      domain: select
                sort:
                  method: entity_id

  - title: Home
    type: masonry
    cards:
      - type: custom:bubble-card
        card_type: button
        entity: sensor.fuel_price_map_unleaded_petrol_ulp_lowest_price
        name: Cheapest Unleaded
        icon: mdi:gas-station
        show_state: true
        show_attribute: true
        attribute: station_name
        tap_action:
          action: navigate
          navigation_path: "#fuel-history-unleaded"

      - type: custom:bubble-card
        card_type: pop-up
        hash: "#fuel-history-unleaded"
        name: Unleaded — 14 day history
        cards:
          - type: custom:apexcharts-card
            header:
              title: Lowest Unleaded Price (c/L)
              show: true
            graph_span: 14d
            series:
              - entity: sensor.fuel_price_map_unleaded_petrol_ulp_lowest_price
                name: Lowest price
                type: line
                data_generator: |
                  return entity.attributes.history.map(h => {
                    return [new Date(h.ts).getTime(), h.price];
                  });
